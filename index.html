<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAR #590 HQ Access</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="assets/js/auth.js"></script>
  <script>
    if (isAuthenticated()) {
      window.location.href = "home.html";
    }
  </script>
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="assets/images/war_logo.png" alt="WAR logo" />
      <div class="eyebrow">⚔ WAR Alliance × State 590</div>
      <h1><span class="gradient-text">WAR #590 HQ</span></h1>
      <p class="lead center">This temporary web HQ is password protected. Enter the shared password to access the guides, strategy pages, and external chat link.</p>
      <form class="form-row" onsubmit="handleLogin(event)">
        <input id="password" class="input" type="password" placeholder="Enter password" autocomplete="off" />
        <button class="btn btn-primary" type="submit">Enter HQ</button>
        <div id="error" class="error"></div>
      </form>
      <p class="small">To change the password later, edit <strong>assets/js/auth.js</strong> and replace <strong>WAR590</strong>.</p>
    </div>
  </main>
</body>
</html>
